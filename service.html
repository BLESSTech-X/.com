    body{background:#f8fafc}
    .service-page{max-width:1120px;width:92%;margin:0 auto;padding:32px 0 70px}
    .service-page-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}
    .service-page-brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:1.15rem}

    .service-crumbs{font-size:.88rem;color:#64748b;margin:10px 0 22px}
    .service-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:clamp(20px,4vw,44px);box-shadow:0 16px 50px rgba(15,23,42,.07)}

    .service-main-image{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:#e2e8f0}

    .service-page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .service-content-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;margin-top:22px;align-items:start}
    .service-panel{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:clamp(18px,3vw,28px);margin-bottom:18px}

    .service-feature-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .service-feature{display:flex;gap:10px;align-items:flex-start;color:#334155;padding:12px;border-radius:12px;background:#f8fafc}
    .service-feature i{color:#059669;margin-top:5px}
    .service-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .service-gallery a{display:block;border-radius:14px;overflow:hidden;background:#e2e8f0;border:1px solid #e2e8f0}
    .service-gallery img{width:100%;height:220px;object-fit:cover;transition:transform .2s}
    .service-gallery a:hover img{transform:scale(1.035)}
    .service-demo-list{display:grid;gap:10px}
    .service-demo{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 14px;border:1px solid #e2e8f0;border-radius:12px}
    .service-demo span{font-weight:750;color:#0f172a}.service-demo small{display:block;color:#64748b;font-weight:500}
    .service-side{position:sticky;top:18px}
    .service-side .service-panel{box-shadow:0 10px 30px rgba(15,23,42,.05)}
    .service-side p{color:#64748b;font-size:.92rem;margin-bottom:14px}
    .service-loading,.service-error{text-align:center;padding:70px 16px;color:#475569}
    .service-footer{border-top:1px solid #e2e8f0;padding:22px 0;color:#64748b;font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}
    @media(max-width:820px){.service-hero{grid-template-columns:1fr}.service-main-image{max-height:360px}.service-content-grid{grid-template-columns:1fr}.service-side{position:static}.service-side .service-panel{margin-bottom:0}}

    .service-social-share{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0}
    .service-social-share strong{font-size:.78rem;color:#64748b;margin-right:4px}
    .service-social-share a,.service-social-share button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:37px;padding:8px 11px;border:1px solid #dbe3ed;border-radius:10px;background:#fff;color:#334155;font-size:.78rem;font-weight:750;cursor:pointer;text-decoration:none}
    .service-social-share a:hover,.service-social-share button:hover{background:#eff6ff;border-color:#93c5fd;color:#075985}
    .service-social-share .service-share-wa i{color:#16a34a}.service-social-share .service-share-fb i{color:#1877f2}
    .service-share-feedback{font-size:.78rem;color:#047857;min-height:1.1em;margin-top:7px}
    .service-mobile-cta{display:none}
    .service-hero{position:relative}

    .service-price-box strong{overflow-wrap:anywhere}
    @media(max-width:820px){.service-page{padding-bottom:92px}.service-mobile-cta{position:fixed;display:flex;z-index:1000;left:12px;right:12px;bottom:12px;gap:10px;padding:9px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid #dbe3ed;border-radius:15px;box-shadow:0 10px 35px rgba(15,23,42,.2)}.service-mobile-cta a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:43px;border-radius:10px;text-decoration:none;font-weight:800;font-size:.86rem}.service-mobile-cta .mobile-quote{background:#16a34a;color:#fff}.service-mobile-cta .mobile-contact{background:#eff6ff;color:#075985}}
