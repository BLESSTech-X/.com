<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLESSTech-X</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    .splash-container {
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      border-radius: 20px;
    }
    
    .brand-name {
      color: gold;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    
    .tagline {
      color: #cccccc;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #333333;
      border-top-color: gold;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 1s linear infinite;
    }
    
    .loading-text {
      color: #888888;
      font-size: 12px;
      margin-top: 15px;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/icon-225.jpg" alt="BLESSTech-X" class="logo">
    <div class="brand-name">BLESSTech-X</div>
    <div class="tagline">Websites & E-commerce for Zambia</div>
    <div class="loader"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <script>
    setTimeout(function() {
      window.location.href = "/";
    }, 2000);
  </script>
</body>
</html>
